<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steganography App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
    }
      header {
        background: #4b6cb7;
        color: white;
        text-align: center;
        padding: 15px;
    }
       main {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin: 30px auto;
        width: 90%;
        max-width: 800px;
    }
     .box {
      background: white;
      width: 350px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
       h2 {
      color: #4b6cb7;margin-bottom: 10px;
    }
      input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
     button {
      background: #4b6cb7;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
     }
      button:hover {
      background: #3956a3;
    }
    img {
      width: 100%;border-radius: 6px; margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Steganography App</h1>
  </header>
  <main>
      <div class="box">
      <h2>Upload Image</h2>
      <input type="file" accept="image/*">
      <img src="" alt="Image Preview">
      </div>

      <div class="box">
      <h2>Secret Message</h2>
      <textarea rows="6" placeholder=" Type your secret message here..."></textarea>
      <button>Encode Message</button>
      </div>
   </main>
</body>
</html>
