<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <style>
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
    }

   
    .navbar {
      display: flex;
      justify-content: space-between; 
      align-items: center;           
      background-color: #1a1a1a;
      padding: 15px 20px;
    }

  
    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

 
    .nav-links {
      display: flex;
      list-style: none;
    }

    .nav-links li {
      margin: 0 15px;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #00bcd4;
    }

   
    .menu-toggle {
      display: none;
      font-size: 28px;
      color: white;
      cursor: pointer;
    }

    
    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 62px;
        right: -100%;     
        width: 200px;
        height: 100vh;
        background: #1a1a1a;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: right 0.5s ease;
      }

      .nav-links li {
        margin: 20px 0;
      }

      .menu-toggle {
        display: block;
      }

      .nav-links.active {
        right: 0;  
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">MyWebsite</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <div class="menu-toggle">&#9776;</div>
  </nav>

       <script>
        const menuToggle =    document.querySelector('.menu-toggle');
      const navLinks =  document.querySelector('.nav-links');

      menuToggle.addEventListener('click',   () => {
        navLinks.classList.toggle('active');
    });
     </script>

</body>
</html>
